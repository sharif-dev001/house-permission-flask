<!DOCTYPE html>
<html>
<head>
    <title>House Request</title>

    <style>
        body {
            font-family: Arial;
            background: #f3f4f6;
            margin: 0;
        }

        .header {
            background: #4f46e5;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 500px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }
    </style>
</head>

<body>

<div class="header">
    <h2>House Construction Request</h2>
</div>

<div class="container">

    <form method="POST">

        <input type="text" name="location" placeholder="Enter location" required>

        <textarea name="description" placeholder="Describe your request..." required></textarea>

        <button type="submit">Submit Request</button>

    </form>

</div>

</body>
</html>
