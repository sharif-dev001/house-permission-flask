<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Users Management</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f4f6f9;
        }

        .header {
            background: #111827;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header a {
            color: white;
            text-decoration: none;
            background: #22c55e;
            padding: 8px 12px;
            border-radius: 6px;
        }

        .container {
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        th {
            background: #1f2937;
            color: white;
        }

        tr:hover {
            background: #f1f5f9;
        }

        .badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            color: white;
        }

        .admin { background: #ef4444; }
        .user { background: #3b82f6; }
        .sector { background: #f97316; }
        .village { background: #10b981; }
        .isibo { background: #8b5cf6; }

    </style>
</head>

<body>

<div class="header">
    <h2>Users Management</h2>
    <a href="/admin/create-user">+ Create User</a>
</div>

<div class="container">

    <table>
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Role</th>
        </tr>

        {% for u in users %}
        <tr>
            <td>{{ u.id }}</td>
            <td>{{ u.username }}</td>

            <td>
                <span class="badge {{ u.role }}">
                    {{ u.role }}
                </span>
            </td>
        </tr>
        {% endfor %}

    </table>

</div>

</body>
</html>
