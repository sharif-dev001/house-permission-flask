<!DOCTYPE html>
<html>
<head>
    <title>Village Dashboard</title>

    <style>
        body {
            font-family: Arial;
            background: #f9fafb;
            margin: 0;
        }

        .header {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h2 {
            margin: 0;
        }

        .container {
            padding: 30px;
            display: flex;
            justify-content: center;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 350px;
            text-align: center;
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 18px;
            background: #f59e0b;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            background: #d97706;
        }

        .logout {
            text-align: center;
            margin-top: 20px;
        }

        .logout a {
            color: red;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="header">
    <h2>Village Leader Dashboard</h2>
    <p>Welcome {{ username }}</p>
</div>

<div class="container">

    <div class="card">
        <h3>Village Approvals</h3>
        <p>Review approved requests from Isibo level</p>

        <!-- LINK ADDED HERE PROPERLY -->
        <a href="{{ url_for('auth.village_requests') }}" class="btn">
            View Pending Requests
        </a>
    </div>

</div>

<div class="logout">
    <a href="{{ url_for('auth.logout') }}">Logout</a>
</div>

</body>
</html>
