<!DOCTYPE html>
<html>
<head>
    <title>User Dashboard</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f3f4f6;
        }

        .header {
            background: #4f46e5;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            padding: 30px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            max-width: 500px;
        }

        a {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 15px;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .btn-secondary {
            background: #10b981;
        }

        .logout {
            background: #ef4444;
        }
    </style>
</head>

<body>

<div class="header">
    <h2>User Dashboard</h2>
    <p>Welcome {{ username }}</p>
</div>

<div class="container">

    <!-- REQUEST CARD -->
    <div class="card">
        <h3>House Permission Request</h3>
        <p>Submit your construction request here</p>

        <a href="{{ url_for('auth.request_house') }}">
            Submit Request
        </a>
    </div>

    <!-- MY REQUESTS CARD (ADDED FEATURE) -->
    <div class="card">
        <h3>My Requests</h3>
        <p>Check status of your submitted requests</p>

        <a class="btn-secondary" href="{{ url_for('auth.my_requests') }}">
            View My Requests
        </a>
    </div>

</div>

<!-- LOGOUT -->
<div style="padding: 0 30px;">
    <a class="logout" href="{{ url_for('auth.logout') }}">
        Logout
    </a>
</div>

</body>
</html>
