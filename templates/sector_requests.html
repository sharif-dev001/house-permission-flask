<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sector Approval Requests</title>

    <style>

        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:#eef2ff;
        }

        .header{
            background:#312e81;
            color:white;
            padding:20px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .logout{
            background:#ef4444;
            color:white;
            text-decoration:none;
            padding:10px 15px;
            border-radius:6px;
        }

        .container{
            padding:25px;
        }

        .card{
            background:white;
            padding:20px;
            border-radius:12px;
            margin-bottom:20px;
            box-shadow:0 4px 10px rgba(0,0,0,0.08);
        }

        h3{
            color:#4338ca;
            margin-top:0;
        }

        p{
            color:#374151;
        }

        textarea{
            width:100%;
            height:80px;
            padding:10px;
            border-radius:8px;
            border:1px solid #ccc;
            margin-top:10px;
            resize:none;
        }

        .buttons{
            display:flex;
            gap:10px;
            margin-top:15px;
            flex-wrap:wrap;
        }

        button{
            border:none;
            padding:10px 16px;
            border-radius:8px;
            color:white;
            font-weight:bold;
            cursor:pointer;
        }

        .approve{
            background:#16a34a;
        }

        .approve:hover{
            background:#15803d;
        }

        .reject{
            background:#dc2626;
        }

        .reject:hover{
            background:#b91c1c;
        }

        .download{
            background:#2563eb;
            color:white;
            text-decoration:none;
            padding:10px 16px;
            border-radius:8px;
            font-weight:bold;
        }

        .download:hover{
            background:#1d4ed8;
        }

        .status{
            display:inline-block;
            padding:6px 12px;
            border-radius:20px;
            font-size:12px;
            color:white;
            background:#16a34a;
            margin-top:10px;
        }

    </style>

</head>

<body>

<div class="header">

    <h2>Sector Approval Panel</h2>

    <a class="logout" href="/logout">
        Logout
    </a>

</div>

<div class="container">

{% for req in requests %}

<div class="card">

    <h3>
        Construction Request #{{ req.id }}
    </h3>

    <p>
        <strong>Location:</strong>
        {{ req.location }}
    </p>

    <p>
        <strong>Description:</strong>
        {{ req.description }}
    </p>

    <!-- IF NOT APPROVED -->
    {% if req.status != 'approved' %}

    <!-- APPROVE -->
    <form method="POST"
          action="/sector/action/{{ req.id }}/approve">

        <textarea
            name="reason"
            placeholder="Approval note"></textarea>

        <div class="buttons">

            <button class="approve" type="submit">
                Final Approve
            </button>

        </div>

    </form>

    <!-- REJECT -->
    <form method="POST"
          action="/sector/action/{{ req.id }}/reject">

        <textarea
            name="reason"
            placeholder="Reason for rejection"></textarea>

        <div class="buttons">

            <button class="reject" type="submit">
                Reject
            </button>

        </div>

    </form>

    {% else %}

    <!-- APPROVED STATE -->
    <div class="status">
        APPROVED
    </div>

    <div class="buttons">

        <a class="download"
           href="/download/{{ req.id }}">

            Download Permission PDF

        </a>

    </div>

    {% endif %}

</div>

{% endfor %}

</div>

</body>
</html>
